
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Infinity Disco</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h3>INFINITY DISCO</h3>
                        <h5>Registro de Membresía</h5>
                    </div>

                    <div class="card-body">

                        <form id="formulario">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" id="nombre"
                                       class="form-control"
                                       placeholder="Ingrese su nombre"
                                       required>
                            </div>

                            <!-- Edad -->
                            <div class="mb-3">
                                <label for="edad" class="form-label">Edad</label>
                                <input type="number" id="edad"
                                       class="form-control"
                                       placeholder="Ingrese su edad"
                                       min="1" max="120" step="1" required>
                            </div>

                            <!-- Ciudad -->
                            <div class="mb-3">
                                <label for="ciudad" class="form-label">Ciudad</label>
                                <input type="text" id="ciudad"
                                       class="form-control"
                                       placeholder="Ingrese su ciudad"
                                       required>
                            </div>

                            <!-- Sexo -->
                            <div class="mb-3">
                                <label for="sexo" class="form-label">Sexo</label>
                                <select id="sexo" class="form-select" required>
                                    <option value="">Seleccione su sexo</option>
                                    <option value="Masculino">Masculino</option>
                                    <option value="Femenino">Femenino</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>

                            <!-- Membresía automática -->
                            <div class="mb-3">
                                <label for="membresia" class="form-label">
                                    Membresía asignada
                                </label>
                                <input type="text" id="membresia"
                                       class="form-control"
                                       placeholder="Se asigna automáticamente"
                                       readonly>
                            </div>

                            <!-- Botón -->
                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Verificar acceso
                            </button>

                        </form>

                        <div id="resultado" class="mt-3"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="disco.js"></script>

</body>
</html>
